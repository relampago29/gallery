<!DOCTYPE html>

<head>
<script type="text/javascript">
const
	parentWindow = window.opener || window.parent,
	harness	  = parentWindow?.Siesta?.my.activeHarness,
	test		 = harness?.ACTIVE_TEST;
if (test) {
	window.bryntum = { ...(window.bryntum || {}), isTestEnv : true };
	test.setupConsoleHook(window);
	window.addEventListener('error', e => {
		const message = e.error?.message || e.message;
		// Skip ResizeObserver and Script errors
		if (!/(ResizeObserver|Script error)/.test(message)) {
			test.fail('Error: ' + message);
		}
	});
	const preloadScript = test.getConfigParam('preloadScript');
	if (preloadScript) {
		document.write('<script type="text/javascript">' + preloadScript + '<\/script>');
	}
}
</script>
